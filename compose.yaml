services:
  # --- Backend (Spring Boot) ---
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - gradle-cache:/root/.gradle
    environment:
      SPRING_DEVTOOLS_RESTART_ENABLED: true
      TZ: Asia/Tokyo
    # --continuous オプションで変更検知＆再起動させる
    command: ./gradlew bootRun --continuous
    depends_on:
      - db

  # --- Frontend (React) ---
  # frontend:
  #   build: ./frontend
  #   ports:
  #     - "5173:5173"
  #   volumes:
  #     - ./frontend:/app
  #   environment:
  #     - CHOKIDAR_USEPOLLING=true # ホットリロード用設定

  # --- Database (PostgreSQL) ---
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydb
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d

volumes:
  gradle-cache:
  db-data: